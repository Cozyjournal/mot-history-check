<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="auto">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
  </defs>

  <!-- Advisory Card -->
  <g transform="translate(20, 20)">
    <rect width="170" height="320" rx="12" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect width="170" height="8" rx="4" fill="#3B82F6"/>
    <circle cx="85" cy="55" r="26" fill="#EFF6FF"/>
    <text x="85" y="62" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="bold" fill="#2563EB" text-anchor="middle">ℹ</text>
    <text x="85" y="110" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="bold" fill="#1E293B" text-anchor="middle">ADVISORY</text>
    <rect x="35" y="125" width="100" height="26" rx="13" fill="#ECFDF5"/>
    <text x="85" y="142" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#059669" text-anchor="middle">PASS RESULT</text>
    <text x="85" y="180" font-family="'Inter', sans-serif" font-size="12" fill="#475569" text-anchor="middle">Warning of wear</text>
    <text x="85" y="200" font-family="'Inter', sans-serif" font-size="12" fill="#475569" text-anchor="middle">Monitor closely</text>
    <text x="85" y="220" font-family="'Inter', sans-serif" font-size="12" fill="#475569" text-anchor="middle">Legal to drive</text>
    <rect x="25" y="260" width="120" height="36" rx="6" fill="#F1F5F9"/>
    <text x="85" y="282" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Action: Monitor</text>
  </g>

  <!-- Minor Card -->
  <g transform="translate(210, 20)">
    <rect width="170" height="320" rx="12" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect width="170" height="8" rx="4" fill="#10B981"/>
    <circle cx="85" cy="55" r="26" fill="#ECFDF5"/>
    <text x="85" y="62" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold" fill="#10B981" text-anchor="middle">✓</text>
    <text x="85" y="110" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="bold" fill="#1E293B" text-anchor="middle">MINOR</text>
    <rect x="35" y="125" width="100" height="26" rx="13" fill="#ECFDF5"/>
    <text x="85" y="142" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#059669" text-anchor="middle">PASS RESULT</text>
    <text x="85" y="180" font-family="'Inter', sans-serif" font-size="12" fill="#475569" text-anchor="middle">Small safety issue</text>
    <text x="85" y="200" font-family="'Inter', sans-serif" font-size="12" fill="#475569" text-anchor="middle">Not hazardous</text>
    <text x="85" y="220" font-family="'Inter', sans-serif" font-size="12" fill="#475569" text-anchor="middle">Repair soon</text>
    <rect x="25" y="260" width="120" height="36" rx="6" fill="#F1F5F9"/>
    <text x="85" y="282" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Action: Repair soon</text>
  </g>

  <!-- Major Card -->
  <g transform="translate(400, 20)">
    <rect width="170" height="320" rx="12" fill="url(#cardGrad)" stroke="#FDBA74" stroke-width="1.5"/>
    <rect width="170" height="8" rx="4" fill="#F97316"/>
    <circle cx="85" cy="55" r="26" fill="#FFF7ED"/>
    <text x="85" y="62" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold" fill="#F97316" text-anchor="middle">!</text>
    <text x="85" y="110" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="bold" fill="#1E293B" text-anchor="middle">MAJOR</text>
    <rect x="35" y="125" width="100" height="26" rx="13" fill="#FEF2F2"/>
    <text x="85" y="142" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#DC2626" text-anchor="middle">MOT FAIL</text>
    <text x="85" y="180" font-family="'Inter', sans-serif" font-size="12" fill="#475569" text-anchor="middle">May impact safety</text>
    <text x="85" y="200" font-family="'Inter', sans-serif" font-size="12" fill="#475569" text-anchor="middle">Puts others at risk</text>
    <text x="85" y="220" font-family="'Inter', sans-serif" font-size="12" fill="#475569" text-anchor="middle">Fix immediately</text>
    <rect x="25" y="260" width="120" height="36" rx="6" fill="#FFEDD5"/>
    <text x="85" y="282" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#C2410C" text-anchor="middle">Drive: Direct to repair</text>
  </g>

  <!-- Dangerous Card -->
  <g transform="translate(590, 20)">
    <rect width="170" height="320" rx="12" fill="url(#cardGrad)" stroke="#FCA5A5" stroke-width="2"/>
    <rect width="170" height="8" rx="4" fill="#DC2626"/>
    <circle cx="85" cy="55" r="26" fill="#FEF2F2"/>
    <text x="85" y="62" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="bold" fill="#DC2626" text-anchor="middle">✕</text>
    <text x="85" y="110" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="bold" fill="#991B1B" text-anchor="middle">DANGEROUS</text>
    <rect x="35" y="125" width="100" height="26" rx="13" fill="#DC2626"/>
    <text x="85" y="142" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">MOT FAIL</text>
    <text x="85" y="180" font-family="'Inter', sans-serif" font-size="12" fill="#7F1D1D" text-anchor="middle">Immediate danger</text>
    <text x="85" y="200" font-family="'Inter', sans-serif" font-size="12" fill="#7F1D1D" text-anchor="middle">Severe road hazard</text>
    <text x="85" y="220" font-family="'Inter', sans-serif" font-size="12" fill="#7F1D1D" text-anchor="middle">DO NOT DRIVE</text>
    <rect x="25" y="260" width="120" height="36" rx="6" fill="#FEE2E2"/>
    <text x="85" y="282" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#991B1B" text-anchor="middle">Drive: ILLEGAL</text>
  </g>
</svg>
